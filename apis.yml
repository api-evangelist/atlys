aid: atlys
name: Atlys
description: >-
  Atlys is a digital visa application platform that helps travelers obtain
  tourist, business, and transit visas on time for 150+ destinations, backed by
  a guarantee. Founded in 2020 by Mohak Nahta and headquartered in San
  Francisco, Atlys asks travelers a short set of questions and then automates
  form-filling, document compilation (itineraries, cover letters, NOCs, flight
  and hotel confirmations), payment, and appointment booking against official
  government and embassy requirements that are refreshed monthly. It covers
  e-visas, visa-on-arrival, Schengen, US, UK ETA and more, and serves travelers
  from India, the United States, the United Kingdom, the UAE, Australia,
  Singapore, and Saudi Arabia. Atlys Enterprise adds group processing (up to
  1,000 travelers), HRMS/payroll integrations (Workday, Rippling), concierge
  support, and secure passport logistics for corporate travel teams. Atlys is
  backed by Andreessen Horowitz (a16z), Sequoia, Accel, and others, having
  raised over $40M across multiple rounds.
